<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STOP! Multiplayer Category Rush</title>
    <meta name="description" content="Vibrant real-time online multiplayer STOP category word game with letter roulette, live pressure countdown, custom rooms, global and weekly leaderboards, chat, daily challenges, and offline practice." />
    <meta property="og:title" content="STOP! Multiplayer Category Rush" />
    <meta property="og:description" content="Vibrant real-time online multiplayer STOP category word game with letter roulette, live pressure countdown, custom rooms, global and weekly leaderboards, chat, daily challenges, and offline practice." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f43f5e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="STOP! Game" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
      // Suppress external browser extension runtime errors (MetaMask, wallet extensions)
      window.addEventListener('error', function(event) {
        if (
          (event.filename && event.filename.includes('chrome-extension://')) ||
          (event.message && (event.message.includes('MetaMask') || event.message.includes('ethereum') || event.message.includes('inpage.js')))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.includes('MetaMask') || msg.includes('chrome-extension://') || msg.includes('ethereum') || msg.includes('inpage.js')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-x-hidden selection:bg-rose-500 selection:text-white" data-state="title">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
